<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>REG. FOTO</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      padding: 30px;
    }

    h1 {
      color: #333;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #1a73e8;
      color: white;
    }

    #video {
      display: none;
      width: 100%;
      max-width: 600px;
      margin: 20px auto;
      border-radius: 10px;
      background: black;
    }

    #erro {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <h1>📷 REG. FOTO</h1>

  <button onclick="abrirCamera()">
    Abrir Câmera
  </button>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <p id="status"></p>

  <p id="erro"></p>


  <script>

    async function abrirCamera() {

      document.getElementById('status')
        .innerText = 'Solicitando acesso à câmera...';

      document.getElementById('erro')
        .innerText = '';

      try {

        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
          });

        const video =
          document.getElementById('video');

        video.srcObject = stream;

        video.style.display = 'block';

        document.getElementById('status')
          .innerText = '✅ Câmera funcionando!';

      }

      catch (erro) {

        console.error(erro);

        document.getElementById('status')
          .innerText = '';

        document.getElementById('erro')
          .innerText =
            'Erro: ' +
            erro.name +
            ' - ' +
            erro.message;

      }

    }

  </script>

</body>

</html>
