<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>REG. FOTO</title>

  <style>

    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f5f5f5;
      margin: 0;
      padding: 25px;
    }

    h1 {
      margin-bottom: 20px;
    }

    #video {
      width: 100%;
      max-width: 700px;
      background: #000;
      border-radius: 10px;
      display: none;
    }

    button {
      padding: 14px 25px;
      margin: 10px;
      border: none;
      border-radius: 7px;
      font-size: 17px;
      cursor: pointer;
      background: #1a73e8;
      color: white;
    }

    button:hover {
      background: #1557b0;
    }

    #status {
      font-weight: bold;
      margin-top: 15px;
    }

    #erro {
      color: #d93025;
      font-weight: bold;
      margin-top: 15px;
    }

  </style>

</head>

<body>

  <h1>📷 REG. FOTO</h1>

  <button onclick="abrirCamera()">
    📷 Abrir Câmera
  </button>

  <br>

  <video
    id="video"
    autoplay
    playsinline>
  </video>

  <p id="status"></p>

  <p id="erro"></p>


  <script>

    let stream = null;


    async function abrirCamera() {

      const status =
        document.getElementById('status');

      const erro =
        document.getElementById('erro');

      const video =
        document.getElementById('video');


      status.innerText =
        'Solicitando acesso à câmera...';

      erro.innerText = '';


      try {

        if (
          !navigator.mediaDevices ||
          !navigator.mediaDevices.getUserMedia
        ) {

          throw new Error(
            'O navegador não disponibilizou a câmera.'
          );

        }


        stream =
          await navigator.mediaDevices.getUserMedia({

            video: true,

            audio: false

          });


        video.srcObject =
          stream;


        video.style.display =
          'block';


        status.innerText =
          '✅ Câmera funcionando!';


      }

      catch (e) {

        console.error(e);


        status.innerText = '';


        erro.innerText =
          'Erro: ' +
          e.name +
          ' - ' +
          e.message;

      }

    }

  </script>

</body>

</html>
